[package]
name = "eos-agent-cli"
description = "The `eos-agent` command: run or chat with an agent from a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "eos-agent"
path = "src/main.rs"

[dependencies]
eos-agent-anthropic.workspace = true
eos-agent-compat.workspace = true
eos-agent-core.workspace = true
eos-agent-engine.workspace = true
eos-agent-openai.workspace = true
eos-agent-sdk.workspace = true
eos-agent-tools-session.workspace = true
eos-agent-types.workspace = true
anyhow.workspace = true
base64.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["env"] }
crossterm.workspace = true
tokio = { workspace = true, features = ["io-std"] }
unicode-width.workspace = true
uuid.workspace = true

[dev-dependencies]
eos-agent-mock-api.workspace = true
libc.workspace = true

[lints]
workspace = true
