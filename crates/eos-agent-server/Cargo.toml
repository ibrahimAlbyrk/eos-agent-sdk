[package]
name = "eos-agent-server"
description = "Hosts agents for another program: JSON-RPC 2.0 over stdio or a unix socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "eos-agent-server"
path = "src/main.rs"

[dependencies]
eos-agent-anthropic.workspace = true
eos-agent-core.workspace = true
eos-agent-engine.workspace = true
eos-agent-sdk.workspace = true
eos-agent-tools-session.workspace = true
eos-agent-types.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
eos-agent-mock-api.workspace = true

[lints]
workspace = true
